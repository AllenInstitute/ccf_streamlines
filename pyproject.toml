[project]
name = "ccf-streamlines"
version = "1.2.0"
description = "Projection of Allen CCF data via streamlines"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "h5py>=2.10",
    "numpy",
    "pandas",
    "pynrrd",
    "scikit-image",
    "scipy",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/AllenInstitute/ccf_streamlines"
Documentation = "https://ccf-streamlines.readthedocs.io"

[build-system]
requires = ["uv_build>=0.9.26,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# A test pinned to an open contribution asserts the *fixed* behaviour and is
# marked xfail. If it starts passing, the fix has landed and the marker is
# stale, so an unexpected pass must be reported rather than swallowed.
xfail_strict = true

[tool.ruff]
# The package supports 3.9, so the linter must not suggest syntax newer than that
# even when it is run under a newer interpreter.
target-version = "py39"
# Claude Code puts its git worktrees under .claude/worktrees/, each a full copy
# of this repo at whatever commit it was cut from. Ruff has no reason to walk
# into them: they are separate checkouts that lint themselves against their own
# config, and any of them predating the ruff adoption reports the entire
# pre-format tree as errors. Nothing under .claude is gitignored, so ruff's
# usual .gitignore filtering does not cover this. Only the worktrees are
# excluded, so a future .claude/*.py of our own would still be checked.
extend-exclude = [".claude/worktrees"]

[tool.ruff.lint]
# E/W/F are the pycodestyle + pyflakes baseline; I keeps import blocks sorted;
# UP is bounded by target-version above; B and C4 catch the two classes of bug
# this codebase can actually hit -- loop-variable and mutable-default mistakes,
# and needless intermediate collections in array code.
select = ["E", "W", "F", "I", "UP", "B", "C4"]
# Line length is the formatter's job. It cannot split a long comment or a
# docstring line, so leaving E501 on would flag exactly the lines `ruff format`
# is unable to fix.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The re-export of __version__ is the module's entire purpose.
"src/ccf_streamlines/__init__.py" = ["F401"]
