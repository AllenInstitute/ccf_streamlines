[project]
name = "ccf-streamlines"
version = "1.2.0"
description = "Projection of Allen CCF data via streamlines"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "h5py>=2.10",
    "numpy",
    "pandas",
    "pynrrd",
    "scikit-image",
    "scipy",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/AllenInstitute/ccf_streamlines"
Documentation = "https://ccf-streamlines.readthedocs.io"

[build-system]
requires = ["uv_build>=0.9.26,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# A test pinned to an open contribution asserts the *fixed* behaviour and is
# marked xfail. If it starts passing, the fix has landed and the marker is
# stale, so an unexpected pass must be reported rather than swallowed.
xfail_strict = true
