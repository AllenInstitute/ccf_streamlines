# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
    # Read the Docs removed the ubuntu-20.04 image on 2026-06-01; a build that
    # still asks for it fails before Sphinx runs. Supported values are
    # ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, and ubuntu-lts-latest.
    os: ubuntu-24.04
    tools:
        # Only used to run Sphinx. The docs build does not install the package
        # (conf.py mocks the third-party imports), so this is independent of the
        # requires-python floor in pyproject.toml.
        python: "3.12"

sphinx:
    configuration: docs/source/conf.py
    # The build is warning-free against the pinned Sphinx in
    # docs/requirements.txt, so a new warning means the docs have drifted from
    # the code (a renamed object, a dead cross-reference) and should be seen.
    fail_on_warning: true

python:
   install:
   - requirements: docs/requirements.txt
